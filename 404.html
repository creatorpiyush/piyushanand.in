<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Piyush Anand</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script>try{var t=localStorage.getItem('portfolio-theme');if(t&&t!=='aurora')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
  body{ padding:0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .nf{ width:100%; max-width:640px; padding:0 16px; }
  .nf .terminal{ margin:0; }
  .nf .err{ color:var(--rose); }
  .nf .hero-cta{ margin-top:24px; }
</style>
</head>
<body>
  <div class="nf">
    <div class="terminal">
      <div class="terminal-bar">
        <div class="traffic-lights"><span class="r"></span><span class="y"></span><span class="g"></span></div>
        <span class="title">zsh - 404</span>
      </div>
      <div class="terminal-body">
        <div class="line"><span class="prompt">piyush@piyushanand</span>:<span class="path">~</span>$ cat <span id="nfPath">this-page</span></div>
        <div class="line err">cat: No such file or directory</div>
        <div class="hero-cta">
          <a class="btn primary" href="/">cd ~ →</a>
        </div>
      </div>
    </div>
  </div>
<script>document.getElementById('nfPath').textContent = location.pathname.replace(/^\//, '') || 'this-page';</script>
</body>
</html>
